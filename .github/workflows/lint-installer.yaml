name: Lint Installer

on:
  pull_request:
    branches:
      - develop
      - master
    paths:
      - 'installer/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/helmfile/helmfile:v1.7.0
    env:
      # CI валидирует локальные чарты из чекаута: в PR с bump версии чарты
      # ещё не опубликованы в ghcr.io/2gis/charts (публикация — по тегу после merge).
      CHART_LOCATION: ${{ github.workspace }}/charts
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check chart versions match common.yaml.gotmpl
        run: |
          COMMON="$GITHUB_WORKSPACE/installer/helmfile/common.yaml.gotmpl"
          get_version() {
            grep -m1 -oE "$1: [0-9][0-9.]*" "$COMMON" | awk '{print $2}'
          }
          VERSION_CORE=$(get_version versionCore)
          VERSION_PLATFORM=$(get_version versionPlatform)
          VERSION_PRO=$(get_version versionPro)
          VERSION_CITYLENS=$(get_version versionCitylens)
          echo "common.yaml.gotmpl: Core=$VERSION_CORE Platform=$VERSION_PLATFORM Pro=$VERSION_PRO Citylens=$VERSION_CITYLENS"

          FAILED=""
          for chart_path in charts/*/Chart.yaml; do
            chart=$(basename "$(dirname "$chart_path")")
            # gis-platform (Evergis) версионируется независимо от common.yaml.gotmpl
            if [ "$chart" = "gis-platform" ]; then continue; fi
            actual=$(grep -m1 '^version:' "$chart_path" | awk '{print $2}')
            case "$chart" in
              keys|license|keycloak)       expected="$VERSION_CORE" ;;
              pro-api|pro-ui)              expected="$VERSION_PRO" ;;
              citylens|citylens-routes-ui) expected="$VERSION_CITYLENS" ;;
              *)                           expected="$VERSION_PLATFORM" ;;
            esac
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$chart_path::Version mismatch: expected $expected, found $actual"
              FAILED="$FAILED $chart($actual != $expected)"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "Version consistency check failed:$FAILED"
            exit 1
          fi
          echo "Chart versions are consistent with common.yaml.gotmpl"

      # В репозитории секреты хранятся plaintext-каркасом (шифрование — перед деплоем,
      # см. installer/README.md "Секреты"). CI валидирует полный sops-контур: эфемерный
      # age-ключ, шифрование каркаса по правилам example/.sops.yaml (sandbox) и по
      # временной CI-конфигурации (staging), рендер — реальной расшифровкой sops.
      - name: Encrypt example secrets with an ephemeral age key
        run: |
          curl -fsSL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          chmod +x /usr/local/bin/sops
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz | tar xz
          install age/age age/age-keygen /usr/local/bin/
          mkdir -p ~/.config/sops/age
          age-keygen -o ~/.config/sops/age/keys.txt 2>/tmp/age.log
          PUB_KEY=$(sed -n 's/^# public key: //p' ~/.config/sops/age/keys.txt)
          EXAMPLE="$GITHUB_WORKSPACE/installer/helmfile/example"
          # sandbox: правила из example/.sops.yaml (плейсхолдер -> эфемерный ключ)
          sed -i "s/age1REPLACE-WITH-YOUR-PUBLIC-KEY/$PUB_KEY/g" "$EXAMPLE/.sops.yaml"
          find "$EXAMPLE" -path '*sandbox*' -name '*.yaml' \
            -exec sops --config "$EXAMPLE/.sops.yaml" -e -i {} \;
          # staging: файлов каркаса нет в правилах example/.sops.yaml (plaintext по умолчанию),
          # для CI шифруем их временной конфигурацией
          cat > /tmp/sops-staging.yaml <<CFG
          creation_rules:
            - path_regex: '.*staging.*secrets\.yaml$'
              age: $PUB_KEY
          CFG
          find "$EXAMPLE" -path '*staging*' -name '*.secrets.yaml' \
            -exec sops --config /tmp/sops-staging.yaml -e -i {} \;
          # || true: grep -L в busybox возвращает 1, когда зашифрованы все файлы
          UNENCRYPTED=$(find "$EXAMPLE" \( -path '*sandbox*' -o -path '*staging*' \) \
            -name '*.secrets.yaml' -exec grep -L '^sops:' {} +) || true
          if [ -n "$UNENCRYPTED" ]; then
            echo "::error::Files not encrypted: $UNENCRYPTED"
            exit 1
          fi

      - name: Helmfile lint (staging)
        run: |
          HELMFILE_BASE="$GITHUB_WORKSPACE/installer/helmfile" \
          helmfile -e staging -f installer/helmfile/example/deploy/staging.yaml.gotmpl lint

      - name: Helmfile template (staging)
        run: |
          HELMFILE_BASE="$GITHUB_WORKSPACE/installer/helmfile" \
          helmfile -e staging -f installer/helmfile/example/deploy/staging.yaml.gotmpl \
            template --concurrency=1 > installer_artifact

      - name: Helmfile template (sandbox)
        run: |
          HELMFILE_BASE="$GITHUB_WORKSPACE/installer/helmfile" \
          helmfile -e sandbox -f installer/helmfile/example/deploy/sandbox.yaml.gotmpl \
            template --concurrency=1 --args --skip-schema-validation >> installer_artifact

      - name: Helmfile lint (sandbox)
        run: |
          HELMFILE_BASE="$GITHUB_WORKSPACE/installer/helmfile" \
          helmfile -e sandbox -f installer/helmfile/example/deploy/sandbox.yaml.gotmpl \
            lint --args --skip-schema-validation

      - name: Install kubeconform
        run: |
          curl -LO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform

      - name: Validate manifests
        run: |
          for v in 1.33.0 1.32.1 1.31.1 1.30.0 1.29.0; do
            echo "=== Kubernetes $v ==="
            cat installer_artifact | ./kubeconform -summary \
              -kubernetes-version "$v" \
              -ignore-missing-schemas
          done
