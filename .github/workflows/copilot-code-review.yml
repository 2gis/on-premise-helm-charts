name: "Copilot Code Review Environment"

# Preinstalls tooling for Copilot code review, so it can validate findings by
# rendering charts (helm template, helm lint, kubeconform) instead of guessing.
# Tool versions match the CI (lint-helm-charts.yaml).
#
# Note: the environment customization takes effect once this file is present
# on the default branch (develop).
#
# Runs when this file changes, so the setup steps can be validated in a PR.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  # Copilot checks out the repository itself, so no checkout step is needed.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.17.2'

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -LO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Smoke test
        run: |
          helm version
          kubeconform -v
