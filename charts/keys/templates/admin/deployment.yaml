apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keys.admin.name" . }}
  {{- if or .Values.admin.annotations .Values.customCAs.bundle }}
  annotations:
    {{- if .Values.customCAs.bundle }}
    checksum/config: {{ include (print .Template.BasePath "/configmap-deploys.yaml") . | sha256sum }}
    {{- end }}
    {{- with .Values.admin.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    {{- include "keys.admin.labels" . | nindent 4 }}
    {{- with .Values.admin.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.admin.replicas }}
  revisionHistoryLimit: {{ .Values.admin.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.admin.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "keys.admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with include "keys.podAnnotations" (dict "ctx" $ "component" .Values.admin) }}
      annotations:
      {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "keys.admin.labels" . | nindent 8 }}
        {{- with .Values.admin.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with include "keys.podSecurityContext" (dict "ctx" $ "component" .Values.admin) }}
      securityContext:
      {{- . | nindent 8 }}
      {{- end }}
      {{- with include "keys.psql.initTLS" (dict "ctx" $ "component" .Values.admin) }}
      initContainers:
      {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: keys-admin
          image: {{ required "A valid .Values.dgctlDockerRegistry entry required" .Values.dgctlDockerRegistry }}/{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with include "keys.securityContext" (dict "ctx" $ "component" .Values.admin) }}
          securityContext:
          {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          env:
            {{- include "keys.env.admin" . | nindent 12 }}
            {{- include "keys.env.auditEnvMetadata" . | nindent 12 }}
            {{- if .Values.customCAs.bundle }}
            {{- include "keys.env.custom.ca.path" . | nindent 12 }}
            {{- end }}
          volumeMounts:
          {{- if .Values.customCAs.bundle }}
          {{- include "keys.custom.ca.volumeMounts" . | nindent 12 }}
          {{- end }}
          {{- include "keys.psql.volumeMount" . | nindent 12 }}
          {{- with include "keys.writable.volumeMounts" (dict "ctx" $ "component" .Values.admin) }}
          {{- . | nindent 12 }}
          {{- end }}
      volumes:
      {{- if .Values.customCAs.bundle }}
      {{- include "keys.custom.ca.deploys.volumes" . | nindent 8 }}
      {{- end }}
      {{- include "keys.psql.volume" . | nindent 8 }}
      {{- with include "keys.writable.volumes" (dict "ctx" $ "component" .Values.admin) }}
      {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
