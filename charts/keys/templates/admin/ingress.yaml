{{- if .Values.admin.ingress.enabled -}}
{{- include "keys.ingress.checks" (dict "ctx" $ "ingress" .Values.admin.ingress "name" "admin") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "keys.admin.name" . }}
  labels:
    {{- include "keys.admin.labels" . | nindent 4 }}
  {{- with include "keys.ingress.annotations" (dict "ctx" $ "ingress" .Values.admin.ingress) }}
  annotations:
  {{- . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.admin.ingress.className }}
  {{- with include "keys.ingress.tls" (dict "ctx" $ "ingress" .Values.admin.ingress "secretName" (printf "%s-tls" (include "keys.admin.name" $))) }}
  tls:
  {{- . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.admin.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              {{- include "keys.ingress.backend" (dict "ctx" $ "name" (include "keys.admin.name" $) "port" $.Values.admin.service.port) | nindent 14 }}
          {{- end }}
    {{- end }}
{{- end }}
