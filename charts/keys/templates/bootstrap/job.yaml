apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "keys.bootstrap.name" . }}
  labels:
    {{- include "keys.bootstrap.labels" . | nindent 4 }}
  annotations:
    # After install: migrations and import have already applied schema and catalog.
    "helm.sh/hook": post-install,post-upgrade
    # hook-succeeded is omitted on purpose so the pod stays and the API key
    # can be read from `kubectl logs job/<release>-bootstrap`.
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
spec:
  backoffLimit: 0
  template:
    metadata:
      name: {{ include "keys.bootstrap.name" . }}
      {{- with include "keys.podAnnotations" (dict "ctx" $ "component" .Values.bootstrap "job" true) }}
      annotations:
      {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "keys.bootstrap.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with include "keys.podSecurityContext" (dict "ctx" $ "component" .Values.bootstrap) }}
      securityContext:
      {{- . | nindent 8 }}
      {{- end }}
      {{- with include "keys.psql.initTLS" (dict "ctx" $ "component" .Values.bootstrap) }}
      initContainers:
      {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ required "A valid .Values.dgctlDockerRegistry entry required" .Values.dgctlDockerRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with include "keys.securityContext" (dict "ctx" $ "component" .Values.bootstrap) }}
          securityContext:
          {{- . | nindent 12 }}
          {{- end }}
          command: [ "keysctl", "bootstrap", "--log-format", "text" ]
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          env:
            {{- include "keys.env.bootstrap" . | nindent 12 }}
            {{- include "keys.env.featureFlags" . | nindent 12 }}
            {{- include "keys.env.db.deploys" . | nindent 12 }}
            {{- include "keys.env.auditEnvMetadata" . | nindent 12 }}
            {{- if .Values.customCAs.bundle }}
            {{- include "keys.env.custom.ca.path" . | nindent 12 }}
            {{- end }}
          volumeMounts:
          {{- if .Values.customCAs.bundle }}
          {{- include "keys.custom.ca.volumeMounts" . | nindent 12 }}
          {{- end }}
          {{- include "keys.psql.volumeMount" . | nindent 12 }}
          {{- with include "keys.writable.volumeMounts" (dict "ctx" $ "component" .Values.bootstrap) }}
          {{- . | nindent 12 }}
          {{- end }}
      volumes:
      {{- if .Values.customCAs.bundle }}
      {{- include "keys.custom.ca.deploys.volumes" . | nindent 8 }}
      {{- end }}
      {{- include "keys.psql.volume" . | nindent 8 }}
      {{- with include "keys.writable.volumes" (dict "ctx" $ "component" .Values.bootstrap) }}
      {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.bootstrap.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bootstrap.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
