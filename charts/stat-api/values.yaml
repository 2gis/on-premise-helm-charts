  # @param migrate.nodeSelector Kubernetes [node selectors](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector).

  nodeSelector: {}

  # @param migrate.tolerations Kubernetes [tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/) settings.
  tolerations: []

  # @param migrate.podAnnotations Kubernetes [pod annotations](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/).
  # @param migrate.podSecurityContext Pod-level [security settings](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) of the Migrate tool. Merged over the chart-wide `podSecurityContext`.
  # @param migrate.securityContext Container-level [security settings](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) of the Migrate tool. Merged over the chart-wide `securityContext`.
  # @param migrate.writablePaths Paths mounted as `emptyDir` volumes for the Migrate tool. Overrides the chart-wide `writablePaths`.

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  writablePaths: []

# @section ClickHouse settings

# @param clickhouse.servers Comma-separated list of ClickHouse server addresses. Format: `host1:port1,host2:port2`.
# @param clickhouse.cluster ClickHouse cluster name for distributed queries, migrations.
# @param clickhouse.database ClickHouse database name to connect to.
# @param clickhouse.username ClickHouse username for authentication.
# @param clickhouse.password ClickHouse password for authentication.

clickhouse:
  servers: ''
  cluster: ''
  database: ''
  username: ''
  password: ''

  # @param clickhouse.maxQueryExecutionTime Query [maximum execution time](https://clickhouse.com/docs/operations/settings/settings#max_execution_time) in seconds.
  # @param clickhouse.maxOpenConnections Maximum number of open connections to ClickHouse.
  # @param clickhouse.maxIdleConnections Maximum number of idle connections in the pool.

  maxQueryExecutionTime: 60
  maxOpenConnections: 10
  maxIdleConnections: 5

  # @param clickhouse.connectionTimeout Connection timeout duration (e.g., `10s`, `1m`).
  # @param clickhouse.connectionMaxLifetime Maximum lifetime of a connection (e.g., `1h`, `30m`).
  # @param clickhouse.connectionOpenStrategy Connection opening strategy configures algorithm with which it will be decided that server to use for a new connection. Can be: `in_order`, `round_robin`, `random`.
  # @param clickhouse.connectionTimeout Connection timeout duration (e.g., `10s`, `1m`).
  # @param clickhouse.connectionMaxLifetime Maximum lifetime of a connection (e.g., `1h`, `30m`).
  # @param clickhouse.connectionOpenStrategy Connection opening strategy for multiple servers. Can be: `in_order`, `round_robin`, `random`.

  connectionTimeout: 10s
  connectionMaxLifetime: 1h
  connectionOpenStrategy: in_order

  # @param clickhouse.pingMaxRetries Maximum number of ping retries during connection attempts.
  # @param clickhouse.pingRetryDelay Delay between ping retries (e.g., `3s`, `5s`).

  pingMaxRetries: 5
  pingRetryDelay: 3s

  # @section ClickHouse TLS settings

  # @param clickhouse.tls.enabled Enable TLS/SSL connection to ClickHouse.
  # @param clickhouse.tls.skipServerCertificateVerify Skip server certificate verification (insecure). When `true`, the client will not verify the server's certificate chain and host name.
  # @param clickhouse.tls.serverCA ClickHouse server CA certificate in PEM format. If not provided, system root CAs will be used for server certificate verification.
  # @param clickhouse.tls.clientCert ClickHouse client certificate in PEM format for mutual TLS authentication. **Required for mutual TLS**.
  # @param clickhouse.tls.clientKey ClickHouse client private key in PEM format for mutual TLS authentication. **Required for mutual TLS**.

  tls:
    enabled: false
    skipServerCertificateVerify: false
    serverCA: ''
    clientCert: ''
    clientKey: ''

# @section Limits

# @extra api.resources **Limits for the API service**
# @param api.resources.requests.cpu A CPU request.
# @param api.resources.requests.memory A memory request.
# @param api.resources.limits.cpu A CPU limit.
# @param api.resources.limits.memory A memory limit.

# @extra migrate.resources **Limits for the Migrate tool**
# @param migrate.resources.requests.cpu A CPU request.
# @param migrate.resources.requests.memory A memory request.
# @param migrate.resources.limits.cpu A CPU limit.
# @param migrate.resources.limits.memory A memory limit.

# @section customCAs **Custom Certificate Authority**

# @param customCAs.bundle Custom CA [text representation of the X.509 PEM public-key certificate](https://www.rfc-editor.org/rfc/rfc7468#section-5.1)
# @param customCAs.certsPath Custom CA bundle mount directory in the container.

customCAs:
  bundle: ''
# bundle: |
    # -----BEGIN CERTIFICATE-----
    # ...
    # -----END CERTIFICATE-----
  certsPath: ''


# @section [cert-manager](https://cert-manager.io/docs/) settings

# @param certManager.enabled If cert-manager Certificate resources are created for the Ingress hostnames. Wildcard hostnames are not allowed.
# @param certManager.issuer.name Name of the issuer that signs the certificates.
# @param certManager.issuer.kind Kind of the issuer. Can be `ClusterIssuer` or `Issuer`.
# @param certManager.issuer.group API group of the issuer.
# @param certManager.duration Validity period of the certificates.
# @param certManager.renewBefore Period before the expiration when the certificates are renewed.
# @param certManager.privateKey.algorithm Private key algorithm. Can be `RSA`, `ECDSA` or `Ed25519`.
# @param certManager.privateKey.size Private key size.
# @param certManager.annotations Annotations of the Certificate resources, ex: the `helm.sh/hook` settings that issue the certificates before the other resources are deployed.

certManager:
  enabled: false
  issuer:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
  annotations: {}
  # annotations:
  #   helm.sh/hook: pre-install,pre-upgrade
  #   helm.sh/hook-weight: '-20'


# @section Service Mesh settings

# @extra serviceMesh **[Istio](https://istio.io/latest/docs/) settings that implement the zero trust security model: mTLS between the pods and the edge gateways deployed in the release namespace.**

# @param serviceMesh.enabled If the Istio resources are created for the services of the chart. Requires Istio to be installed in the cluster.
# @param serviceMesh.sidecarInject If the Istio sidecar is injected into the pods. The sidecar is never injected into the Jobs of the chart.
# @param serviceMesh.mtls.mode Mutual TLS mode for the pods of the chart. Can be `STRICT`, `PERMISSIVE` or `DISABLE`.
# @param serviceMesh.mtls.minProtocolVersion Minimum TLS version accepted by the gateways. Can be `TLSV1_2` or `TLSV1_3`. The sidecar-to-sidecar minimum version is set by the mesh-wide Istio configuration.
# @param serviceMesh.ingressGateway.enabled If the ingress Gateway and the VirtualService that routes the incoming traffic to the service are created.
# @param serviceMesh.ingressGateway.selector.istio Label of the ingress gateway pods deployed in the release namespace.
# @param serviceMesh.ingressGateway.serviceName Name of the ingress gateway Service deployed in the release namespace. The Ingress resource of the chart sends the traffic to this Service.
# @param serviceMesh.ingressGateway.port Port of the ingress gateway that serves the incoming traffic.
# @param serviceMesh.ingressGateway.tls.mode TLS mode of the ingress gateway. `PASSTHROUGH` keeps the traffic encrypted up to the service, which is required by the passthrough-only policy.
# @param serviceMesh.ingressGateway.tls.credentialName Name of the secret with the gateway certificate. Used by the `SIMPLE` and `MUTUAL` modes only.
# @param serviceMesh.egressGateway.enabled If the egress Gateway and the VirtualServices that route the outgoing traffic through it are created.
# @param serviceMesh.egressGateway.selector.istio Label of the egress gateway pods deployed in the release namespace.
# @param serviceMesh.egressGateway.port Port of the egress gateway that serves the outgoing traffic.
# @param serviceMesh.egressGateway.hosts External hostnames whose traffic is routed through the egress gateway.
# @param serviceMesh.authorizationPolicy.enabled If the AuthorizationPolicy that allows the traffic from the authorized sources only is created.
# @param serviceMesh.authorizationPolicy.allowedNamespaces Namespaces allowed to reach the services of the chart. The release namespace is always allowed.
# @param serviceMesh.authorizationPolicy.allowedPrincipals Service account principals allowed to reach the services of the chart, ex: `cluster.local/ns/default/sa/client`.
# @param serviceMesh.jwt.enabled If the incoming requests are authenticated by the JWT tokens on the gateway.
# @param serviceMesh.jwt.issuer Issuer of the accepted JWT tokens.
# @param serviceMesh.jwt.jwksUri URL of the JSON Web Key Set of the issuer.
# @param serviceMesh.jwt.audiences Audiences of the accepted JWT tokens.
# @param serviceMesh.jwt.forwardOriginalToken If the original token is forwarded to the service.
# @param serviceMesh.externalAuth.enabled If the requests are authorized by an external authorization provider.
# @param serviceMesh.externalAuth.provider Name of the `extensionProviders` entry defined in the Istio mesh configuration.
# @param serviceMesh.externalAuth.rules Rules that define the requests sent to the external authorization provider. All the requests are sent by default.

serviceMesh:
  enabled: false
  sidecarInject: true
  mtls:
    mode: STRICT
    minProtocolVersion: TLSV1_2
  ingressGateway:
    enabled: true
    selector:
      istio: ingressgateway
    serviceName: istio-ingressgateway
    port: 443
    tls:
      mode: PASSTHROUGH
      credentialName: ''
  egressGateway:
    enabled: false
    selector:
      istio: egressgateway
    port: 443
    hosts: []
    # - external-api.example.com
  authorizationPolicy:
    enabled: true
    allowedNamespaces: []
    allowedPrincipals: []
  jwt:
    enabled: false
    issuer: ''
    jwksUri: ''
    audiences: []
    forwardOriginalToken: true
  externalAuth:
    enabled: false
    provider: ''
    rules: []


# @section Kubernetes [Network Policy](https://kubernetes.io/docs/concepts/services-networking/network-policies/) settings

# @param networkPolicy.enabled If the NetworkPolicy resources are created. A deny-all policy is applied to the pods of the chart, and the traffic is allowed for the sources listed below only.
# @param networkPolicy.allowedNamespaces Names of the namespaces allowed to reach the services of the chart. The release namespace is always allowed.
# @param networkPolicy.allowedNamespaceSelectors Additional [namespace selectors](https://kubernetes.io/docs/concepts/services-networking/network-policies/#behavior-of-to-and-from-selectors) of the allowed sources.
# @param networkPolicy.dnsPorts[0] Port used to resolve DNS names. The egress traffic to this port is always allowed.
# @param networkPolicy.egressRules Additional [egress rules](https://kubernetes.io/docs/concepts/services-networking/network-policies/#behavior-of-to-and-from-selectors), ex: the rules that allow the traffic to ClickHouse and Kafka.
# @param networkPolicy.ingressRules Additional [ingress rules](https://kubernetes.io/docs/concepts/services-networking/network-policies/#behavior-of-to-and-from-selectors).

networkPolicy:
  enabled: false
  allowedNamespaces: []
  allowedNamespaceSelectors: []
  dnsPorts:
  - 53
  egressRules: []
  # - to:
  #   - ipBlock:
  #       cidr: 10.0.0.0/8
  #     ports:
  #     - port: 9000
  #       protocol: TCP
  ingressRules: []
