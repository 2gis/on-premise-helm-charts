# @section Docker Registry settings

# @param dgctlDockerRegistry Docker Registry endpoint where On-Premise services' images reside. Format: `host:port`.

dgctlDockerRegistry: ''

# @section Common settings

# @param imagePullSecrets Kubernetes image pull secrets.
# @param imagePullPolicy Pull policy.
# @param api.image.repository API service image repository.
# @param api.image.tag API service image tag.
# @param migrate.image.repository Migrate tool image repository.
# @param migrate.image.tag Migrate tool image tag.

imagePullSecrets: []
imagePullPolicy: IfNotPresent

# @section Security settings

# @param podSecurityContext.enabled If the pod security context is enabled.
# @param podSecurityContext.runAsNonRoot If the containers of the chart are not allowed to run as the root user.
# @param podSecurityContext.runAsUser UID of a non-privileged user that exists in the images.
# @param podSecurityContext.runAsGroup GID of a non-privileged group that exists in the images.
# @param podSecurityContext.fsGroup GID applied to the mounted volumes.
# @param securityContext.enabled If the container security context is enabled.
# @param securityContext.privileged If the containers are run in the privileged mode.
# @param securityContext.allowPrivilegeEscalation If a process of a container can gain more privileges than its parent process.
# @param securityContext.readOnlyRootFilesystem If the root filesystem of the containers is read-only. See `writablePaths` for the directories the services still need to write to.
# @param securityContext.runAsNonRoot If the containers are not allowed to run as the root user.
# @param securityContext.runAsUser UID of a non-privileged user that exists in the images.
# @param securityContext.runAsGroup GID of a non-privileged group that exists in the images.
# @param securityContext.capabilities.drop Linux capabilities to drop. All the capabilities are dropped by default.
# @param securityContext.seccompProfile.type Type of the [seccomp](https://kubernetes.io/docs/tutorials/security/seccomp/) profile. Can be `RuntimeDefault`, `Localhost` or `Unconfined`.
# @param automountServiceAccountToken If the ServiceAccount API token is mounted into the pods of the chart. The service does not use the Kubernetes API, so the token is not mounted by default.
# @param enableServiceLinks If the information about the services of the namespace is injected into the pods as environment variables.
# @param writablePaths Paths mounted as `emptyDir` volumes when `securityContext.readOnlyRootFilesystem` is enabled. Can be overridden per service, e.g. by `api.writablePaths`.
# @param volumeDefaultMode Permissions of the files mounted from the Secret and ConfigMap volumes. `256` is the decimal representation of `0400`.

# The settings below are applied to every workload of the chart and comply with the
# [restricted](https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted) Pod Security Standard.
# `runAsUser` and `runAsGroup` must refer to an existing non-privileged user and group of the images:
# override them if your images are built with different IDs.

podSecurityContext:
  enabled: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  enabled: false
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault

automountServiceAccountToken: false
enableServiceLinks: false

writablePaths:
- /tmp

volumeDefaultMode: 256

# @section Kubernetes [Service Account](https://kubernetes.io/docs/concepts/security/service-accounts/) settings

# @param serviceAccount.create Specifies whether a service account should be created
# @param serviceAccount.automount Automatically mount a ServiceAccount's API credentials?
# @param serviceAccount.annotations Annotations to add to the service account
# @param serviceAccount.name The name of the service account to use. If not set and create is true, a name is generated using the fullname template

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ''

# @section API service settings

api:
  image:
    repository: 2gis-on-premise/stat-api
    tag: 0.2.5

  # @param api.logLevel Log level for the service. Can be: `trace`, `debug`, `info`, `warning`, `error`, `fatal`.

  logLevel: warning

  # @param api.clickhouse.clientName Name that will be used in client requests to ClickHouse.

  clickhouse:
    clientName: stat-api

  # @param api.replicas A replica count for the pod.

  replicas: 1

  # @param api.revisionHistoryLimit Revision history limit (used for [rolling back](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/) a deployment).

  revisionHistoryLimit: 3

  # @param api.strategy.type Type of Kubernetes deployment. Can be `Recreate` or `RollingUpdate`.
  # @param api.strategy.rollingUpdate.maxUnavailable Maximum number of pods that can be created over the desired number of pods when doing [rolling update](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-update-deployment).
  # @param api.strategy.rollingUpdate.maxSurge Maximum number of pods that can be unavailable during the [rolling update](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-update-deployment) process.

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 256Mi

  # @param api.annotations Kubernetes [annotations](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/).
  # @param api.labels Kubernetes [labels](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/).

  annotations: {}
  labels: {}

  # @param api.podAnnotations Kubernetes [pod annotations](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/).
  # @param api.podLabels Kubernetes [pod labels](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/).

  podAnnotations: {}
  podLabels: {}

  # @param api.podSecurityContext Pod-level [security settings](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) of the API service. Merged over the chart-wide `podSecurityContext`.
  # @param api.securityContext Container-level [security settings](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) of the API service. Merged over the chart-wide `securityContext`.
  # @param api.writablePaths Paths mounted as `emptyDir` volumes for the API service. Overrides the chart-wide `writablePaths`.

  podSecurityContext: {}
  securityContext: {}
  writablePaths: []

  # @param api.nodeSelector Kubernetes [node selectors](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector).
  # @param api.affinity Kubernetes pod [affinity settings](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity).
  # @param api.tolerations Kubernetes [tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/) settings.

  nodeSelector: {}
  affinity: {}
  tolerations: []

  # @param api.service.annotations Kubernetes [service annotations](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/).
  # @param api.service.labels Kubernetes [service labels](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/).
  # @param api.service.type Kubernetes [service type](https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types).
  # @param api.service.port Service port.

  service:
    annotations: {}
    labels: {}
    type: ClusterIP
    port: 80

  # @section Kubernetes [Ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/) settings

  # @param api.ingress.enabled If Ingress is enabled for the service.
  # @param api.ingress.className Name of the Ingress controller class.
  # @param api.ingress.annotations Kubernetes [ingress annotations](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/).
  # @param api.ingress.sslPassthrough If the TLS traffic is passed to the service without being decrypted by the Ingress controller. Only the passthrough mode is allowed for the TLS hostnames.
  # @param api.ingress.hosts[0].host Hostname for the Ingress service. Wildcard hostnames are not allowed.
  # @param api.ingress.hosts[0].paths[0].path Path of the host for the Ingress service.
  # @param api.ingress.hosts[0].paths[0].pathType Type of the path for the Ingress service.
  # @param api.ingress.tls TLS configuration. Generated from the hostnames above when `certManager.enabled` is set.

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    sslPassthrough: true
    hosts:
    - host: stat-api.host
      paths:
      - path: /
        pathType: Prefix
    tls: []
    # - hosts:
    #   - stat-api.example.com
    #   secretName: secret.tls

  # @section Kubernetes [HTTPRoute](https://gateway-api.sigs.k8s.io/api-types/httproute/) settings

  # @param api.httpRoute.enabled If HTTPRoute is enabled for the service.
  # @param api.httpRoute.hostnames Array of [Hostnames](https://gateway-api.sigs.k8s.io/reference/spec/#hostname) for the HTTPRoute [spec](https://gateway-api.sigs.k8s.io/reference/spec/#httproutespec).
  # @param api.httpRoute.parentRefs Array of [ParentReferences](https://gateway-api.sigs.k8s.io/reference/spec/#parentreference) for the HTTPRoute [spec](https://gateway-api.sigs.k8s.io/reference/spec/#httproutespec).
  # @param api.httpRoute.annotations Kubernetes [annotations](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/) of the HTTPRoute.

  httpRoute:
    enabled: false
    hostnames: []
    parentRefs: []
    annotations: {}

  # @section Kubernetes [Horizontal Pod Autoscaling](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/) settings

  # @param api.hpa.enabled If HPA is enabled for the service.
  # @param api.hpa.minReplicas Lower limit for the number of replicas to which the autoscaler can scale down.
  # @param api.hpa.maxReplicas Upper limit for the number of replicas to which the autoscaler can scale up.
  # @param api.hpa.scaleDownStabilizationWindowSeconds Scale-down window.
  # @param api.hpa.scaleUpStabilizationWindowSeconds Scale-up window.
  # @param api.hpa.targetCPUUtilizationPercentage Target average CPU utilization (represented as a percentage of requested CPU) over all the pods; if not specified the default autoscaling policy will be used.
  # @param api.hpa.targetMemoryUtilizationPercentage Target average memory utilization (represented as a percentage of requested memory) over all the pods; if not specified the default autoscaling policy will be used.

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    scaleDownStabilizationWindowSeconds: ''
    scaleUpStabilizationWindowSeconds: ''
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ''

