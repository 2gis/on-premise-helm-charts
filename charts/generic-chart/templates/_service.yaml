{{- define "generic-chart.service.tpl" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "generic-chart.fullname" . }}
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
    {{- if (.Values.service).labels }}
        {{- include "tplvalues.render" ( dict "value" .Values.service.labels "context" .) | nindent 4 }}
    {{- end }}
  {{- if (.Values.service).annotations }}
  annotations:
    {{- include "tplvalues.render" ( dict "value" (.Values.service).annotations "context" .) | nindent 4 }}
  {{- end }}
spec:
  type: {{ (.Values.service).type | default "ClusterIP" | quote }}
  clusterIP: {{ (.Values.service).clusterIP | default "" | quote }}
  {{- if contains "NodePort" ((.Values.service).type | default "ClusterIP") }}
  externalTrafficPolicy: Cluster
  {{- end }}
  ports:
    {{- if (.Values.service).ports }}
    {{- range $port := .Values.service.ports }}
    {{- if not (kindIs "map" $port) }}
    {{- fail "service.ports entries must be maps" }}
    {{- end }}
    {{- $_ := required "service.ports[].name is required" $port.name }}
    {{- $_ := required "service.ports[].port is required" $port.port }}
    {{- $_ := required "service.ports[].targetPort is required" $port.targetPort }}
    {{- if $port.nodePort | default false }}
      {{- if not (contains "NodePort" (($.Values.service).type | default "ClusterIP")) }}
        {{- fail "For nodePort need set `service.type` to `NodePort`" }}
      {{- end }}
    {{- end }}
    {{- toYaml (list $port) | nindent 4 }}
    {{- end }}
    {{- else }}
    - port: {{ (.Values.service).port | default 80 | int }}
      targetPort: {{ (.Values.service).targetPort | default "http" }}
      protocol: {{ (.Values.service).protocol | default "TCP" }}
      name: {{ (.Values.service).name | default "http" }}
      {{- if hasKey (.Values.service | default dict) "appProtocol" }}
      {{- with .Values.service.appProtocol }}
      appProtocol: {{ . | quote }}
      {{- end }}
      {{- else }}
      appProtocol: http
      {{- end }}
      {{- if (.Values.service).nodePort | default false }}
        {{- if contains "NodePort" ((.Values.service).type | default "ClusterIP") }}
      nodePort: {{ .Values.service.nodePort }}
        {{- else }}
          {{ printf "For nodePort need set `service.type` to `NodePort`" | fail }}
        {{- end }}
    {{- end }}
      {{- end }}
  selector:
    {{- include "generic-chart.selectorLabels" . | nindent 4 }}
{{- end }} {{- /* define */}}
