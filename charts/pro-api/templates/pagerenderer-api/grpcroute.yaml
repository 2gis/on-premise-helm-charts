{{- if and .Values.pagerenderer.settings.enabled .Values.pagerenderer.settings.grpcRoute.enabled }}

apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ include "pro-api.pagerenderer-name" . }}
spec:
  {{- with .Values.pagerenderer.settings.grpcRoute.hostnames }}
  hostnames:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .Values.pagerenderer.settings.grpcRoute.parentRefs }}
  parentRefs:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "pro-api.pagerenderer-name" . }}
          port: {{ .Values.pagerenderer.settings.grpcRoute.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

{{- end }}
