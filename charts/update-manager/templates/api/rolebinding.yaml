---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "update-manager.name" . }}
  labels:
    {{- include "update-manager.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "update-manager.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "update-manager.name" . }}
