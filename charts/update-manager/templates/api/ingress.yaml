{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "update-manager.name" . }}
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "update-manager.labels" . | nindent 4 }}
    {{- with .Values.api.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not (empty .Values.api.ingress.className) }}
  ingressClassName: {{ .Values.api.ingress.className }}
  {{- end }}
  rules:
    {{- range $host := .Values.api.ingress.hosts }}
    - host: {{ $host.host | quote }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ include "update-manager.name" $ }}
                port:
                  name: http
    {{- end }}
  {{- with .Values.api.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
