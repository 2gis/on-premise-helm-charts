---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "update-manager.name" . }}
  labels:
    {{- include "update-manager.labels" . | nindent 4 }}
rules:
# =====================================================================
# Unconditional base rules — always granted regardless of managedCharts
# =====================================================================
# Manage worker jobs (create, watch their status, terminate when needed)
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Mount ConfigMaps/Secrets into the jobs and read/write Helm 3 release state
# (Helm keeps release data and `helm get values` output in Secrets/ConfigMaps).
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# =====================================================================
# Per-chart rules — added only when a chart is enabled in api.components.
# Each block is self-contained: it grants every resource kind that the
# chart renders, not relying on the base rules above.
# =====================================================================
{{- if .Values.api.rulesOverride }}
{{ toYaml .Values.api.rulesOverride }}
{{- else }}

{{- $enabledCharts := list }}
{{- range $_, $component := .Values.api.components }}
  {{- range $chartName, $chart := $component.charts }}
    {{- if $chart.enabled }}
      {{- $enabledCharts = append $enabledCharts $chartName }}
    {{- end }}
  {{- end}}
{{- end }}
{{- if has "keys" $enabledCharts }}
# keys
{{- include "update-manager.rbac.rule.appsDeployment" . | nindent 0 }}
{{- include "update-manager.rbac.rule.appsStatefulSet" . | nindent 0 }}
{{- include "update-manager.rbac.rule.coreService" . | nindent 0 }}
{{- include "update-manager.rbac.rule.coreConfigMap" . | nindent 0 }}
{{- include "update-manager.rbac.rule.coreSecret" . | nindent 0 }}
{{- include "update-manager.rbac.rule.corePod" . | nindent 0 }}
{{- include "update-manager.rbac.rule.batchJob" . | nindent 0 }}
{{- include "update-manager.rbac.rule.batchCronJob" . | nindent 0 }}
{{- include "update-manager.rbac.rule.networkingIngress" . | nindent 0 }}
{{- include "update-manager.rbac.rule.autoscalingHPA" . | nindent 0 }}
{{- end }}
{{- if has "tiles-api" $enabledCharts }}
# tiles-api
{{- include "update-manager.rbac.rule.appsDeployment" . | nindent 0 }}
{{- include "update-manager.rbac.rule.coreService" . | nindent 0 }}
{{- include "update-manager.rbac.rule.coreServiceAccount" . | nindent 0 }}
{{- include "update-manager.rbac.rule.coreConfigMap" . | nindent 0 }}
{{- include "update-manager.rbac.rule.coreSecret" . | nindent 0 }}
{{- include "update-manager.rbac.rule.corePod" . | nindent 0 }}
{{- include "update-manager.rbac.rule.batchJob" . | nindent 0 }}
{{- include "update-manager.rbac.rule.batchCronJob" . | nindent 0 }}
{{- include "update-manager.rbac.rule.networkingIngress" . | nindent 0 }}
{{- include "update-manager.rbac.rule.autoscalingHPA" . | nindent 0 }}
{{- include "update-manager.rbac.rule.autoscalingVPA" . | nindent 0 }}
{{- include "update-manager.rbac.rule.policyPDB" . | nindent 0 }}
{{- include "update-manager.rbac.rule.rbac" . | nindent 0 }}
# Roles copied from tiles-api's own Role (tiles-api/templates/role.yaml)
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete", "deletecollection"]
{{- end }}
