# @section Docker Registry settings

# @param dgctlDockerRegistry Docker Registry endpoint where On-Premise services' images reside. Format: `host:port`.

dgctlDockerRegistry: ''


# @section Common settings

# @param nameOverride Base name to use in all the Kubernetes entities deployed by this chart.
# @param fullnameOverride Base fullname to use in all the Kubernetes entities deployed by this chart.

nameOverride: ""
fullnameOverride: ""


# @section Service account settings

# @param serviceAccount.create Specifies whether a service account should be created.
# @param serviceAccount.annotations Annotations to add to the service account.
# @param serviceAccount.name The name of the service account to use. If not set and create is true, a name is generated using the fullname template.
# @param serviceAccount.deleteHook.create If SA for delete hook should be created.
# @param serviceAccount.deleteHook.name SA name for delete hook. Auto generated based on main SA if empty.

serviceAccount:
  create: false
  annotations: {}
  name: ""
  deleteHook:
    create: false
    name: ""


# @section RBAC settings

# @param rbac.create Specifies whether a role and roleBinding should be created
# @param rbac.annotations Annotations to add the role and roleBinding
# @param rbac.labels Role and RoleBinding additional labels
# @param rbac.deleteHook.create If create RBAC for deleteHook

rbac:
  create: false
  annotations: {}
  labels: {}
  deleteHook:
    create: false


# @section Container image settings

# @param image.repository Repository
# @param image.tag Tag
# @param image.pullPolicy Pull Policy

image:
  repository: 2gis-on-premise/navi-data-sync
  pullPolicy: IfNotPresent
  tag: ''


# @section Deployment settings

# @param annotations Custom annotations to set to Deployment resource
# @param labels Custom labels to set to Deployment resource
# @param podAnnotations Custom annotations to set to Pod resource
# @param podLabels Custom annotations to set to Pod resource
# @param imagePullSecrets Kubernetes image pull secrets
# @param affinity Kubernetes pod [affinity settings](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity)
# @param nodeSelector Kubernetes [node selectors](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
# @param tolerations Kubernetes [tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/) settings
# @param priorityClassName Kubernetes [Pod Priority](https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/#priorityclass) class name
# @param podSecurityContext Kubernetes [pod security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)
# @param securityContext Security context for containers
# @param terminationGracePeriodSeconds Maximum time allowed for graceful shutdown
# @param helmMaxHistory Maximum number of child Helm releases kept in history
# @param helmTimeout Timeout for Helm operations
# @param activeDeadlineSeconds Maximum allowed jobs duration
# @param backoffLimit Number of retries for each job until failing the execution

annotations: {}
labels: {}
podAnnotations: {}
podLabels: {}
imagePullSecrets: []
affinity: {}
nodeSelector: {}
tolerations: []
priorityClassName: ""
podSecurityContext: {}
securityContext: {}
terminationGracePeriodSeconds: 120
helmMaxHistory: 10
# Timeout considerations:
# - navi-data-sync job calls helm upgrade for each child chart,
#   every single helm call allowed to run `helmTimeout` amount of time
# - in case of failures helm runs rollback, its duration is counted separately
# - overall job duration is limited by activeDeadlineSeconds,
#   it should be at least (number of children + 1) * helmTimeout
#   plus some few more minutes for initialization and cleanup
# - deployment CI job needs to exceed activeDeadlineSeconds
helmTimeout: 40m
activeDeadlineSeconds: 4800
backoffLimit: 6


# @section Schedule settings

# @param randomSchedule.enabled If randomization of cron schedule and NaviDataSync start enabled
# @param randomSchedule.maxDelaySec Maximum jobs delay. Set 0 for no delay
# @param randomSchedule.specific Specific schedule used when randomSchedule.enabled=false

randomSchedule:
  enabled: true
  maxDelaySec: 300
  specific: '*/10 * * * *'


# @section Limits

# @param resources [nullable] Container resources requirements structure.
# @param resources.requests.cpu [nullable] CPU request, recommended value `1000m`.
# @param resources.requests.memory [nullable] Memory request, recommended value `2Gi`.
# @param resources.limits.cpu [nullable] CPU limit, recommended value `3000m`.
# @param resources.limits.memory [nullable] Memory limit, recommended value `8Gi`.

resources: {}


# @section Instance settings

# @param dataGroup.prefix common prefix for the group used for identifiers
# @param navigroup Navigation group identifier
# @param type Deployment mode: `back` (navi-back) or `attr` (attractor)
# @param castleUrl URL of Navi-Castle service. <br> This URL should be accessible from all the pods within your Kubernetes cluster.
# @param citiesPb3Conf If true, Attractor and Back use protobuf3 Cities config
# @param projects List of projects to refresh data for. Leave empty for all available projects on Castle.
# @param routing List of routing types to refresh data for. Leave empty for all available ones.
# @param fixedTimestamp Fixed timestamp to use instead of querying Castle for the latest.

dataGroup:
  prefix: sampleGroup

navigroup: ''
type: back
castleUrl: ''
citiesPb3Conf: false
projects: []
routing: []
fixedTimestamp: ''


# @section Metrics settings

# @param metrics.enabled If pushing metrics from Jobs enabled
# @param metrics.gateway URL to metrics push gateway
# @param metrics.labels Additional labels for metrics

metrics:
  enabled: false
  # Victoria Metrics agent URL to push metrics to
  gateway: example.com
  # additional metrics labels, e.g. {"job": "navi-data-sync"}
  labels: {}


# @section Navi Attractor sub-chart settings

# @param naviAttractor.releaseName Helm release name for the child
# @param naviAttractor.values [nullable] Helm installation values for the child
# @param naviAttractor.values.image [nullable] Image for the child deployment
# @skip naviAttractor.values.image.repository
# @skip naviAttractor.values.image.tag
# @param naviAttractor.valuesString Array of value files supplied with --set-file
# @param naviAttractor.templateFilename Child chart package filename. `templateContentBase64` takes precedence if set.
# @param naviAttractor.templateContentBase64 Child chart tar.gz package Base64 encoded. If set,takes precedence over `templateFilename`

naviAttractor:
  releaseName: navi-attr
  values:
    image:
      repository: 2gis-on-premise/navi-attractor
      tag: ''
  valuesString: ''
  templateFilename: resources/navi-attractor.tgz
  templateContentBase64: ''


# @section Navi Backend sub-chart settings

# @param naviBack.releaseName Helm release name for the child
# @param naviBack.values [nullable] Helm installation values for the child
# @param naviBack.values.image [nullable] Image for the child deployment
# @skip naviBack.values.image.repository
# @skip naviBack.values.image.tag
# @param naviBack.valuesString Array of value files supplied with --set-file
# @param naviBack.templateFilename Child chart package filename. `templateContentBase64` takes precedence if set.
# @param naviBack.templateContentBase64 Child chart tar.gz package Base64 encoded. If set,takes precedence over `templateFilename`

naviBack:
  releaseName: navi-back
  values:
    image:
      repository: 2gis-on-premise/navi-back
      tag: ''
  valuesString: ''
  templateFilename: resources/navi-back.tgz
  templateContentBase64: ''


# @section SNS data source

# @param sns.enabled If SNS provides data instead of Castle, `castleUrl` refers to SNS
# @param sns.rulesId.projects Projects list identifier segment in SNS path
# @param sns.rulesId.routing Routing list identifier segment in SNS path
# @param sns.rulesId.prefix Arbitrary prefix to be added to SNS paths

sns:
  enabled: false
  rulesId:
    projects: ''
    routing: ''
    prefix: default

# @section Metadata settings
# @param blobVersion Blob version string. When set, init container is disabled and this value is passed directly to NaviDataSync.

blobVersion: ''
