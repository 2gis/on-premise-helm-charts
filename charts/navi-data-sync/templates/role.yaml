  - list
  - watch
  - delete
- apiGroups: ["gateway.networking.k8s.io"]
  # For helm uninstall (HTTPRoute)
  resources:
  - httproutes
  verbs:
  - get
  - list
  - watch
  - delete
{{- end }}
