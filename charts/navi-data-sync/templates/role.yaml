  - watch
  - delete
  - deletecollection
- apiGroups: ["batch"]
  # For navi-data-sync and helm uninstall
  resources:
  - jobs/status
  - cronjobs/status
  verbs:
  - get
  - list
- apiGroups: ["apps"]
  # For helm uninstall
  resources:
  - replicasets
  - deployments
  verbs:
  - get
  - list
  - watch
  - delete
  - deletecollection
- apiGroups: ["policy"]
  # For navi-data-sync and helm uninstall
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
  - delete
  - deletecollection
- apiGroups: ["autoscaling"]
  # For navi-data-sync and helm uninstall
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
  - delete
  - deletecollection
- apiGroups: ["autoscaling.k8s.io"]
  # For navi-data-sync and helm uninstall
