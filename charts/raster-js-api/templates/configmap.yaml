apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "generic-chart.fullname" . }}-config
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "protocol": {{ printf "%s:" .Values.api.protocol | quote }},
      "baseUrl": {{ printf "//%s" .Values.api.publicHost | quote }},
      "tileServer": {{ print .Values.api.tileServerUrl "/v2/tiles?x={x}&y={y}&z={z}&key={key}&ts=raster" | quote }},
      "retinaTileServer": {{ print .Values.api.tileServerUrl "/v2/tiles?x={x}&y={y}&z={z}&key={key}&ts=raster" | quote }},
      "previewTileServer": {{ print .Values.api.tileServerUrl "/v2/tiles?x={x}&y={y}&z={z}&key={key}&ts=raster" | quote }},
      "previewRetinaTileServer": {{ print .Values.api.tileServerUrl "/v2/tiles?x={x}&y={y}&z={z}&key={key}&ts=raster" | quote }},
      "arabicTileServer": {{ print .Values.api.tileServerUrl "/v2/tiles?x={x}&y={y}&z={z}&key={key}&ts=raster" | quote }},
      "arabicRetinaTileServer": {{ print .Values.api.tileServerUrl "/v2/tiles?x={x}&y={y}&z={z}&key={key}&ts=raster" | quote }},
      "arabicPreviewTileServer": {{ print .Values.api.tileServerUrl "/v2/tiles?x={x}&y={y}&z={z}&key={key}&ts=raster" | quote }},
      "arabicPreviewRetinaTileServer": {{ print .Values.api.tileServerUrl "/v2/tiles?x={x}&y={y}&z={z}&key={key}&ts=raster" | quote }},
      "keyServer": {{ .Values.api.keyServerUrl | quote }},
      "webApiServer": {{ .Values.api.catalogApiServerUrl | quote }},
      "poiMetaServer": "disabled",
      "retinaPoiMetaServer": "disabled",
      "arabicPoiMetaServer": "disabled",
      "arabicRetinaPoiMetaServer": "disabled",
      "trafficTileServer": "disabled",
      "retinaTrafficTileServer": "disabled",
      "trafficMetaServer": "disabled",
      "retinaTrafficMetaServer": "disabled",
      "trafficTimestampServer": "disabled",
      "trafficScoreServer": "disabled"
    }
