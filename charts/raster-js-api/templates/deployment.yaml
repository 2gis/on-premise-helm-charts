---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "generic-chart.fullname" . }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if .Values.strategy }}
  strategy:
    {{- include "tplvalues.render" ( dict "value" .Values.strategy "context" $) | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "generic-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "generic-chart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "generic-chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: {{ include "generic-chart.fullname" . }}-config
          configMap:
            name: {{ include "generic-chart.fullname" . }}-config
        {{- if or .Values.api.catalogApiKey .Values.api.key }}
        - name: {{ include "generic-chart.fullname" . }}-secret
          secret:
            secretName: {{ include "generic-chart.fullname" . }}
            items:
              {{- if .Values.api.key }}
              - key: key
                path: apiKey
              {{- end }}
              {{- if .Values.api.catalogApiKey }}
              - key: webApiKey
                path: webApiKey
              {{- end }}
        {{- end }}
        {{- if .Values.customCAs.bundle }}
        - name: {{ include "generic-chart.fullname" . }}-configmap-ca
          configMap:
            name: {{ include "generic-chart.fullname" . }}-configmap-ca
        {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- include "tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "generic-chart.containerName" . }}
          image: {{ required "A valid .Values.dgctlDockerRegistry entry required" .Values.dgctlDockerRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MAPSAPI2_CONFIG_FILE
              value: "/config/config.json"
            {{- if .Values.api.key }}
            - name: MAPSAPI2_KEY_FILE
              value: "/secrets/apiKey"
            {{- end }}
            {{- if .Values.api.catalogApiKey }}
            - name: MAPSAPI2_WEB_API_KEY_FILE
              value: "/secrets/webApiKey"
              {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: {{ include "generic-chart.fullname" . }}-config
              mountPath: /config
              readOnly: true
            {{- if or .Values.api.catalogApiKey .Values.api.key }}
            - name: {{ include "generic-chart.fullname" . }}-secret
              mountPath: /secrets
              readOnly: true
            {{- end }}
            {{- if .Values.customCAs.bundle }}
            - name: {{ include "generic-chart.fullname" . }}-configmap-ca
              mountPath: {{ include "custom.ca.mountPath" . }}/custom-ca.crt
              subPath: custom-ca.crt
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            failureThreshold: 5
            initialDelaySeconds: 5
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
        {{- with .Values.sidecars }}
        {{- include "tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- include "tplvalues.render" ( dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
