{{- if .Values.unisearcher.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "search-api-v8.fullname" . }}-unisearcher
  labels:
    {{- include "search-api-v8.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.unisearcher.port }}
      targetPort: {{ .Values.unisearcher.ports.grpc }}
      protocol: TCP
      name: grpc
  selector:
    {{- include "search-api-v8.selectorLabels" . | nindent 4 }}
    search/part: unisearcher
{{- end }}{{- /* .Values.unisearcher.enabled */}}
