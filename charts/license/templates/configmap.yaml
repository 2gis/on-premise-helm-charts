{{- with .Values -}}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "license.fullname" $ }}
  labels:
    {{- include "license.labels" $ | nindent 4 }}
data:
  config.yaml: |
    {{- with .license }}
    license:
      retry-period: {{ .retryPeriod }}
      warning-period: {{ .softBlockPeriod }}
      {{- if eq (include "license.type" $) "4" }}
      {{- with .internet }}
      {{- if or .endpoint .updatePeriod .timeout }}
      internet:
        {{- with .endpoint }}
        endpoint: {{ . }}
        {{- end }}
        {{- with .updatePeriod }}
        update-period: {{ . }}
        {{- end }}
        {{- with .timeout }}
        timeout: {{ . }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- end }}
    server:
      http-port: {{ .statusPort }}
      https-port: {{ .apiPort }}
    {{- end }}
    {{- with .dgctlStorage }}
    storage:
      host: {{ required "A valid $.Values.dgctlStorage.host entry is required" .host }}
      secure: {{ .secure }}
      region: {{ .region }}
      bucket: {{ required "A valid $.Values.dgctlStorage.bucket entry is required" .bucket }}
    {{- end }}
    {{- with .persistence }}
    persistence:
      host: {{ .host }}
      secure: {{ .secure }}
      region: {{ .region }}
      bucket: {{ .bucket }}
      root: {{ .root }}
    {{- end }}

{{- end -}}
