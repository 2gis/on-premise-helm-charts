---
# dgctl config for the sandbox (kind) environment.
# Working config, plaintext in this repo; encrypt before pull and decrypt back after
# (see installer/README.md, "Секреты"). In your own copy fill the key and encrypt
# with YOUR sops key. Versions are bumped by release commits.
# Fill in the 2GIS license key, then encrypt and pull:
#   sops --config $HELMFILE_VALUES/.sops.yaml -e -i $HELMFILE_VALUES/dgctl/dgctl-config-sandbox.yaml
#   ${HELMFILE_BASE}/../dgctl/pull.sh dgctl-config-sandbox.yaml
# Decrypt back after the pull (also with --config, or sops re-emits with 4-space indent):
#   sops --config $HELMFILE_VALUES/.sops.yaml -d -i $HELMFILE_VALUES/dgctl/dgctl-config-sandbox.yaml
# sandbox-todo: вставьте лицензионный ключ 2GIS
key: ''
log-format: text
storage:
  type: s3
  # in-cluster MinIO ingress (add to /etc/hosts or use port-forward)
  host: s3.sandbox
  bucket: sandbox-dgctl
  access-key: admin
  secret-key: on-premise
docker:
  registry:
    username: ''
    password: ''
    server-address: http://localhost:5000
    image-prefix: /
components:
  core:
    version: 2.11.0
  api-platform:
    version: 2.58.0
