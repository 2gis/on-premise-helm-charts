# dgctl config for the INTERNET host in the isolated (two-host) contour - copy and fill.
# Plaintext in this repo: fill in the values, then encrypt with YOUR sops key in
# your own copy of the repository (see installer/README.md, "Секреты").
# Used by installer/dgctl-fs: dgctl-pull-fs.sh, dgctl-license-2-request.sh.

key: 00000000-0000-0000-0000-000000000000 # TODO licence key
log-format: json

storage:
  type: fs
  directory: /dgctl-source

# Для утилиты версии 3
components:
  core:
    version: 2.11.1
  api-platform:
    version: 2.58.0
  pro:
    version: 2.5.0
  citylens:
    version: 2.3.0
