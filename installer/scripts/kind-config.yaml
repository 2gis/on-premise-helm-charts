kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: 2gis-on-premise
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.configs."kind-registry:5000".tls]
    insecure_skip_verify = true
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
